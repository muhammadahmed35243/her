<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@0,600;1,400;1,500&family=Space+Grotesk:wght@500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07080d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);overflow:hidden}
  #garden{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(180deg,#d8c2c4 0%,#ffe3e8 16%,#ffdde6 52%,#ffc6d5 82%,#b88b97 100%)}
  #garden canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  #gardenHint{position:relative;z-index:2;font:400 clamp(2.3rem,10vw,3.6rem) 'Great Vibes',cursive;color:#5b3a4a;text-shadow:0 2px 16px rgba(255,255,255,.8);animation:hintPulse 2.6s ease-in-out infinite;transition:opacity .9s,transform .9s;pointer-events:none}
  @keyframes hintPulse{50%{opacity:.55;transform:scale(1.03)}}
  #garden.go #gardenHint{opacity:0;transform:translateY(-12px);animation:none}
  #blossom{position:absolute;top:22px;right:22px;width:78px;height:78px;z-index:3;cursor:pointer;touch-action:manipulation;animation:bsway 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(214,90,130,.5));-webkit-user-select:none;user-select:none;outline:0}
  #blossom::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:ripple 2s ease-out infinite}
  #blossom svg{width:100%;height:100%;display:block}
  @keyframes bsway{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(5px)}}
  @keyframes ripple{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}
</style>
</head>
<body>
<section id="garden">
  <canvas id="gardenCv"></canvas>
  <div id="gardenHint">Touch the blossom</div>
  <div id="blossom" role="button" tabindex="0" aria-label="Touch the blossom">
    <svg viewBox="-50 -50 100 100" aria-hidden="true">
      <defs><radialGradient id="pg" cx="50%" cy="85%" r="90%"><stop offset="0" stop-color="#ff8fb2"/><stop offset=".6" stop-color="#ffc2d4"/><stop offset="1" stop-color="#fff0f4"/></radialGradient></defs>
      <g stroke="#ef7aa0" stroke-width=".9" stroke-linejoin="round" fill="url(#pg)">
        <path id="bp" d="M0 0 C-22 -14 -28 -38 -9 -47 L0 -41 L9 -47 C28 -38 22 -14 0 0Z"/>
        <path d="M0 0 C-22 -14 -28 -38 -9 -47 L0 -41 L9 -47 C28 -38 22 -14 0 0Z" transform="rotate(72)"/>
        <path d="M0 0 C-22 -14 -28 -38 -9 -47 L0 -41 L9 -47 C28 -38 22 -14 0 0Z" transform="rotate(144)"/>
        <path d="M0 0 C-22 -14 -28 -38 -9 -47 L0 -41 L9 -47 C28 -38 22 -14 0 0Z" transform="rotate(216)"/>
        <path d="M0 0 C-22 -14 -28 -38 -9 -47 L0 -41 L9 -47 C28 -38 22 -14 0 0Z" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="#ffd166"/>
      <g fill="#e07a5f"><circle cx="0" cy="-11" r="1.8"/><circle cx="10.5" cy="-3.4" r="1.8"/><circle cx="6.5" cy="9" r="1.8"/><circle cx="-6.5" cy="9" r="1.8"/><circle cx="-10.5" cy="-3.4" r="1.8"/></g>
    </svg>
  </div>
</section>
<script>
const $ = s => document.querySelector(s);
const rnd = (a, b) => Math.random() * (b - a) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
let ac, master;
function getAC(){
  if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = .9;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
    master.connect(lp).connect(ac.destination); }
  ac.resume(); return ac;
}
function tone(f, t, dur, vol, type = "sine"){
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + .05);
}
function blip(f = 660, d = .08, v = .05){ try { getAC(); tone(f, ac.currentTime, d, v, "sine"); } catch (e) {} }
function chord(freqs, v = .07){ try { getAC(); freqs.forEach((f, i) => tone(f, ac.currentTime + i*.05, 2.2, v, "triangle")); } catch (e) {} }

const gcv = $("#gardenCv"), gctx = gcv.getContext("2d");
const GCOL = ["#e5483b","#ee7a35","#9070d0","#5b94e6","#8fe0cc","#ffffff","#cbbfd0","#f6d86a","#f7b0c4","#78b08a"];
const GSTYLE = ["poppy","poppy","anemone","anemone","ranunc","anemone","ranunc","ranunc","anemone","ranunc"];
function shade(hex, a){
  const n = parseInt(hex.slice(1), 16), f = v => Math.round(a < 0 ? v * (1 + a) : v + (255 - v) * a);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function petal(c, len, wid, col, rot){
  c.save(); c.rotate(rot);
  const g = c.createLinearGradient(0, 0, 0, -len);
  g.addColorStop(0, shade(col, -.2)); g.addColorStop(.5, col); g.addColorStop(1, shade(col, .38));
  c.beginPath(); c.moveTo(0, 0);
  c.bezierCurveTo(-wid, -len * .25, -wid * 1.05, -len * .85, 0, -len);
  c.bezierCurveTo(wid * 1.05, -len * .85, wid, -len * .25, 0, 0); c.closePath();
  c.fillStyle = g; c.fill();
  c.lineWidth = 1.1; c.strokeStyle = shade(col, -.35); c.globalAlpha = .28; c.stroke();
  c.beginPath(); c.moveTo(0, -len * .15); c.lineTo(0, -len * .75); c.strokeStyle = shade(col, .55); c.globalAlpha = .22; c.lineWidth = 1; c.stroke();
  c.restore();
}
function makeSprite(col, style){
  const S = 240, cv = document.createElement("canvas"); cv.width = cv.height = S;
  const c = cv.getContext("2d"); c.translate(S / 2, S / 2);
  c.shadowColor = "rgba(90,40,60,.2)"; c.shadowBlur = 8; c.shadowOffsetY = 3;
  const jit = v => v * (1 + (Math.random() - .5) * .1), TAU = Math.PI * 2;
  if (style === "ranunc"){
    [[9,108,40],[8,88,33],[7,68,27],[6,48,21],[5,30,15]].forEach(([n, len, wid], i) => {
      const off = Math.random() * TAU, cc = shade(col, -.045 * i);
      for (let k = 0; k < n; k++) petal(c, jit(len), wid, cc, off + k / n * TAU + (Math.random() - .5) * .12);
    });
    c.shadowColor = "transparent"; c.beginPath(); c.arc(0, 0, 6, 0, TAU); c.fillStyle = shade(col, -.4); c.fill();
  } else {
    const n = style === "poppy" ? 6 : 8, len1 = 108, wid1 = style === "poppy" ? 54 : 42;
    for (let k = 0; k < n; k++) petal(c, jit(len1), wid1, col, k / n * TAU + (Math.random() - .5) * .1);
    for (let k = 0; k < n; k++) petal(c, jit(len1 * .78), wid1 * .85, shade(col, -.06), (k + .5) / n * TAU);
    c.shadowColor = "transparent";
    const g = c.createRadialGradient(0, 0, 2, 0, 0, 24); g.addColorStop(0, "#3a2a2a"); g.addColorStop(1, "#171012");
    c.beginPath(); c.arc(0, 0, 24, 0, TAU); c.fillStyle = g; c.fill();
    for (let k = 0; k < 26; k++){ const a = k / 26 * TAU, r = 24 + (k % 2) * 5;
      c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, 2.3, 0, TAU); c.fillStyle = k % 3 ? "#f6ecd0" : shade(col, .3); c.fill(); }
    c.beginPath(); c.arc(0, 0, 8, 0, TAU); c.fillStyle = "#8fb06a"; c.fill();
  }
  return cv;
}
const sprites = GCOL.flatMap((col, i) => [makeSprite(col, GSTYLE[i]), makeSprite(col, GSTYLE[i])]);
let field = [], bloomT0 = 0, bloomState = "idle";   // idle | blooming | done
function sizeGarden(){
  const r = devicePixelRatio || 1; gcv.width = innerWidth * r; gcv.height = innerHeight * r; gctx.setTransform(r, 0, 0, r, 0, 0);
}
/* The blossom lands at the bottom-left; flowers grow outward from there until they cover the whole screen. */
function gardenOrigin(){ return {x: 56, y: innerHeight - 56}; }
function buildField(){
  const W = innerWidth, H = innerHeight, u = Math.max(.8, Math.min(1.5, Math.min(W, H) / 420)), O = gardenOrigin();
  const R = Math.hypot(W, H);   // distance to the farthest corner
  field = [];
  [[135, 130, 200], [98, 90, 135], [78, 62, 96]].forEach(([cell, smin, smax]) => {
    const step = cell * u;
    for (let y0 = -step / 2; y0 < H + step / 2; y0 += step) for (let x0 = -step / 2; x0 < W + step / 2; x0 += step){
      const x = x0 + rnd(0, step), y = y0 + rnd(0, step), d = Math.hypot(x - O.x, y - O.y);
      field.push({x, y, size: rnd(smin, smax) * u, sp: pick(sprites), rot: rnd(0, 6.283), ph: rnd(0, 6.283),
        delay: d / R * 3400 + rnd(0, 260)});
    }
  });
}
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function gardenFrame(now){
  gctx.clearRect(0, 0, innerWidth, innerHeight);
  if (bloomState !== "idle"){
    const t = now - bloomT0, calm = bloomState === "done"; let allDone = true;
    for (const f of field){
      const p = Math.max(0, Math.min(1, (t - f.delay) / 950));
      if (p < 1) allDone = false;
      if (p <= 0) continue;
      const s = f.size * Math.max(0, easeOutBack(p)) * (calm ? 1 + Math.sin(now / 2100 + f.ph) * .012 : 1);
      gctx.save(); gctx.translate(f.x, f.y);
      gctx.rotate(f.rot - (1 - p) * 1.2 + (calm ? Math.sin(now / 1700 + f.ph) * .04 : 0));
      gctx.globalAlpha = Math.min(1, p * 2.2); gctx.drawImage(f.sp, -s / 2, -s / 2, s, s); gctx.restore();
    }
    if (bloomState === "blooming" && allDone){ bloomState = "done"; chord([392, 523.25, 659.25], .06); }
  }
  requestAnimationFrame(gardenFrame);
}
sizeGarden(); buildField(); requestAnimationFrame(gardenFrame);
addEventListener("resize", () => { sizeGarden(); buildField(); });
function touchBlossom(){
  if (bloomState !== "idle") return;
  getAC(); $("#garden").classList.add("go");
  const b = $("#blossom"); b.style.animation = "none"; b.style.pointerEvents = "none"; b.classList.add("fell");
  // fall from the top-right corner, swaying, down to the bottom-left landing point
  const r = b.getBoundingClientRect(), O = gardenOrigin(), FALL = 2600;
  const dx = O.x - (r.left + r.width / 2), dy = O.y - (r.top + r.height / 2), N = 14, frames = [];
  for (let i = 0; i <= N; i++){
    const t = i / N, e = t * t * (3 - 2 * t);                       // smoothstep
    frames.push({transform: `translate(${dx * e + Math.sin(t * Math.PI * 3) * 34 * (1 - t)}px,${dy * e}px) rotate(${t * 540}deg) scale(${1 - .15 * t})`,
      opacity: t > .93 ? 0 : 1, offset: t});
  }
  b.animate(frames, {duration: FALL, easing: "linear", fill: "forwards"});
  bloomT0 = performance.now() + FALL - 250; bloomState = "blooming";   // flowers start where the blossom lands
  [392, 523.25, 659.25, 783.99].forEach((f, i) => setTimeout(() => blip(f, .5, .04), 200 + i * 560));
  [1046.5, 880, 1318.5, 1046.5, 1568, 1318.5].forEach((f, i) => setTimeout(() => blip(f, .6, .05), FALL - 100 + i * 480));
}
$("#blossom").addEventListener("pointerdown", e => { e.preventDefault(); touchBlossom(); });
$("#blossom").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") touchBlossom(); });
</script>
</body>
</html>
